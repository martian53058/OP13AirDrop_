name: ActionAgent

on:
  push:
    paths:
      - ".action-agent/**"
      - ".github/action_agent_runner.py"
      - ".github/action_agent_commenter.py"
      - ".github/workflows/action-agent.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: action-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  action-agent:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[action-agent skip]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ActionAgent
        run: python .github/action_agent_runner.py
      - name: Upload ActionAgent output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-agent-output
          path: |
            .action-agent/result.json
            .action-agent/output/
          if-no-files-found: ignore
      - name: Post ActionAgent issue comment
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/action_agent_commenter.py
